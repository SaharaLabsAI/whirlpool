[workspace]
exclude = ["vendor"]
resolver = "2"
members = [
    "crates/chainspec",
    "crates/validators",
    "crates/consensus/traits",
    "crates/consensus/simplex",
    "crates/network/traits",
    "crates/network/commonware",
    "crates/rpc/evm",
    "crates/rpc/mem",
    "crates/node",
    "crates/app/state",
    "crates/app/execute/mem/state",
    "crates/app/execute/evm/state",
    "crates/app/traits",
    "crates/app/execute/evm/app",
    "crates/app/execute/evm/precompiles",
    "crates/app/execute/mem/composite",
    "crates/app/execute/mem/app",
    "crates/app/execute/mem/tx-dispatch",
    "crates/mempool/traits",
    "crates/mempool/mdbx",
    "testing/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.1.1" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.1.1" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.1.1" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.1.1" }
