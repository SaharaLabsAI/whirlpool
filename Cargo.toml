    "crates/consensus",
    "crates/consensus-simplex",
    "crates/p2p",
    "crates/p2p-commonware",
    "crates/evm/rpc",
    "crates/rpc-mem",
    "crates/whirlpool-node",
    "crates/state",
    "crates/state-memory",
    "crates/evm/state",
