[workspace]
exclude = ["vendor"]
resolver = "2"
members = [
    "crates/consensus",
    "crates/consensus-simplex",
    "crates/p2p",
    "crates/p2p-commonware",
    "crates/rpc-eth",
    "crates/whirlpool-node",
    "crates/state",
    "crates/state-memory",
    "crates/state-reth",
    "crates/app",
    "crates/app-evm",
    "crates/mempool",
    "testing/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
