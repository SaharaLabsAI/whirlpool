    "crates/community-pool",
    "crates/validators",
    "crates/consensus",
    "crates/consensus-simplex",
    "crates/p2p",
    "crates/p2p-commonware",
    "crates/evm/rpc",
    "crates/mem/rpc",
    "crates/node",
    "crates/state",
    "crates/mem/state",
    "crates/evm/state",
    "crates/app",
    "crates/evm/app",
    "crates/evm/precompiles",
    "crates/mem/composite",
    "crates/mem/app",
    "crates/mem/tx-dispatch",
    "crates/mempool",
    "crates/mempool-mdbx",
