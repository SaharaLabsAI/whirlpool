[package]
name = "whirlpool-node"
version.workspace = true
edition.workspace = true

[dependencies]
app = { path = "../app" }
app-evm = { path = "../app-evm" }
reth-revm = { path = "../../vendor/reth/crates/revm" }
state = { path = "../state" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[[bin]]
name = "whirlpool-node"
path = "src/main.rs"
