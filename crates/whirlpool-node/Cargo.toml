[package]
name = "whirlpool-node"
version.workspace = true
edition.workspace = true

[dependencies]
app = { path = "../app" }
app-evm = { path = "../app-evm" }
mempool = { path = "../mempool" }
rpc-eth = { path = "../rpc-eth" }
reth-revm = { path = "../../vendor/reth/crates/revm" }
state = { path = "../state" }
state-memory = { path = "../state-memory" }
state-reth = { path = "../state-reth" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
consensus = { path = "../consensus" }
consensus-simplex = { path = "../consensus-simplex" }
p2p-commonware = { path = "../p2p-commonware" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
commonware-runtime = { path = "../../vendor/commonware/runtime" }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "whirlpool-node"
path = "src/main.rs"
