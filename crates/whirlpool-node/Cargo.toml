[package]
name = "whirlpool-node"
version.workspace = true
edition.workspace = true

[dependencies]
app = { path = "../app" }
app-evm = { path = "../app-evm" }
app-mem = { path = "../app-mem" }
mempool-mdbx = { path = "../mempool-mdbx" }
rpc-eth = { path = "../rpc-eth" }
reth-chainspec = { path = "../../vendor/reth/crates/chainspec" }
reth-revm = { path = "../../vendor/reth/crates/revm" }
state = { path = "../state" }
state-memory = { path = "../state-memory" }
state-reth = { path = "../state-reth" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
consensus = { path = "../consensus" }
consensus-simplex = { path = "../consensus-simplex" }
p2p-commonware = { path = "../p2p-commonware" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
commonware-codec = { path = "../../vendor/commonware/codec" }
commonware-p2p = { path = "../../vendor/commonware/p2p" }
commonware-utils = { path = "../../vendor/commonware/utils" }
commonware-runtime = { path = "../../vendor/commonware/runtime" }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "whirlpool-node"
path = "src/main.rs"
