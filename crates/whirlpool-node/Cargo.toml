[package]
name = "whirlpool-node"
version.workspace = true
edition.workspace = true

[dependencies]
consensus = { path = "../consensus" }
consensus-simplex = { path = "../consensus-simplex" }
p2p = { path = "../p2p" }
commonware-consensus = { path = "../../vendor/commonware/consensus" }
commonware-codec = { path = "../../vendor/commonware/codec" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
p2p-commonware = { path = "../p2p-commonware" }
commonware-runtime = { path = "../../vendor/commonware/runtime" }
app = { path = "../app" }
app-evm = { path = "../app-evm" }
state = { path = "../state" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[[bin]]
name = "whirlpool-node"
path = "src/main.rs"
