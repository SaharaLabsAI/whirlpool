[package]
name = "whirlpool-node"
version.workspace = true
edition.workspace = true

[dependencies]
app = { path = "../app/traits" }
app-evm = { path = "../app/evm/app" }
chainspec = { path = "../chainspec" }
mempool-mdbx = { path = "../mempool/mdbx" }
validators = { path = "../validators" }
rpc-eth = { path = "../app/evm/rpc" }
reth-chainspec = { path = "../../vendor/reth/crates/chainspec" }
reth-revm = { path = "../../vendor/reth/crates/revm" }
state = { path = "../app/state" }
state-reth = { path = "../app/evm/state" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
consensus = { path = "../consensus/traits" }
consensus-simplex = { path = "../consensus/simplex" }
network-commonware = { path = "../network/commonware" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
commonware-codec = { path = "../../vendor/commonware/codec" }
commonware-p2p = { path = "../../vendor/commonware/p2p" }
commonware-utils = { path = "../../vendor/commonware/utils" }
commonware-runtime = { path = "../../vendor/commonware/runtime" }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
state-memory = { path = "../app/mem/state" }

[[bin]]
name = "whirlpool-node"
path = "src/main.rs"
