[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true

# This crate exists only for its integration tests; there is no library.
# `cargo test -p integration-tests` runs everything under tests/.
[dependencies]
app = { path = "../../crates/app" }
app-evm = { path = "../../crates/app-evm" }
app-mem = { path = "../../crates/app-mem" }
community-pool = { path = "../../crates/community-pool" }
native-token = { path = "../../crates/native-token" }
rpc-eth = { path = "../../crates/rpc-eth" }
rpc-mem = { path = "../../crates/rpc-mem" }
state = { path = "../../crates/state" }
state-memory = { path = "../../crates/state-memory" }
state-reth = { path = "../../crates/state-reth" }
whirlpool-node = { path = "../../crates/whirlpool-node" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
revm = { version = "34" }
alloy-primitives = { version = "1.5.0" }
alloy-consensus = "1.4.3"
alloy-eips = "1.4.3"
alloy-genesis = "1.4.3"
alloy-provider = { version = "1.4.3", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-network = "1.4.3"
alloy-rpc-types = { version = "1.4.3", features = ["eth"] }
alloy-signer = "1.4.3"
alloy-signer-local = "1.4.3"
reth-chainspec = { path = "../../vendor/reth/crates/chainspec" }
jsonrpsee = { version = "0.26.0", features = ["server"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
reth-rpc-builder = { path = "../../vendor/reth/crates/rpc/rpc-builder" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
