[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true

# This crate exists only for its integration tests; there is no library.
# `cargo test -p integration-tests` runs everything under tests/.
[dependencies]
app = { path = "../../crates/app/traits" }
app-evm = { path = "../../crates/app/execute/evm/app" }
chainspec = { path = "../../crates/chainspec" }
evm-precompiles = { path = "../../crates/app/execute/evm/precompiles" }
app-mem = { path = "../../crates/app/execute/mem/app" }
validators = { path = "../../crates/validators" }
rpc-eth = { path = "../../crates/rpc/evm" }
rpc-mem = { path = "../../crates/rpc/mem" }
state = { path = "../../crates/app/state" }
state-memory = { path = "../../crates/app/execute/mem/state" }
state-reth = { path = "../../crates/app/execute/evm/state" }
whirlpool-node = { path = "../../crates/node" }
commonware-cryptography = { path = "../../vendor/commonware/cryptography" }
revm = { version = "36" }
alloy-primitives = { version = "1.5.0" }
alloy-consensus = "1.4.3"
alloy-eips = "1.4.3"
alloy-genesis = "1.4.3"
alloy-provider = { version = "1.4.3", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-network = "1.4.3"
alloy-rpc-types = { version = "1.4.3", features = ["eth"] }
alloy-signer = "1.4.3"
alloy-signer-local = "1.4.3"
reth-chainspec = { path = "../../vendor/reth/crates/chainspec" }
jsonrpsee = { version = "0.26.0", features = ["server"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
reth-rpc-builder = { path = "../../vendor/reth/crates/rpc/rpc-builder" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
