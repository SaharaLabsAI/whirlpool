name: Nightly ERC20 Benchmark (Single Node)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: nightly-erc20-benchmark-gh-pages
  cancel-in-progress: false
jobs:
  benchmark:
    # GitHub-hosted runners currently support Ubuntu/Windows/macOS labels, not Debian/Alpine.
    runs-on: ubuntu-latest
    env:
      BENCHMARK_TIMEOUT_SECONDS: "3600"
      BENCHMARK_DURATION_SECONDS: "120"
      BENCH_SENDER_ACCOUNTS: "10000"
      BENCH_RECIPIENT_ACCOUNTS: "10000"
      BENCH_BLOCK_INTERVAL_MS: "1000"
      # Execute the dedicated single-node benchmark harness with fixed 2-minute measurement window.
      BENCHMARK_COMMAND: >-
        ./target/release/single_node_transfer_benchmark --duration-seconds 120 --sender-accounts 10000 --recipient-accounts 10000 --block-interval-ms 1000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Reclaim disk space for Nix build artifacts
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL

          docker system prune --all --force || true
          sudo apt-get clean

          echo "Disk usage after cleanup:"
          df -h
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build release benchmark artifacts
        run: |
          nix develop --command bash -lc '
            cargo build --release -p integration-tests --bin single_node_transfer_benchmark
          '
      - name: Run benchmark command and emit raw result
        run: |
          mkdir -p out
          python3 devtools/benchmark/run_single_node_transfer_benchmark.py \
            --output out/raw-result.json \
            --timeout-seconds "${BENCHMARK_TIMEOUT_SECONDS}" \
            --command "${BENCHMARK_COMMAND}"
      - name: Checkout gh-pages baseline (if exists)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-baseline
          fetch-depth: 1
      - name: Build latest report + updated history
        run: |
          mkdir -p out/pages/benchmarks
          python3 devtools/benchmark/update_history_and_render_report.py \
            --raw-result out/raw-result.json \
            --history-in gh-pages-baseline/benchmarks/history.json \
            --history-out out/pages/benchmarks/history.json \
            --report-out out/pages/benchmarks/latest.html \
            --status-out out/status.json
      - name: Prepare GitHub Pages entrypoint files
        run: |
          cat > out/pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./benchmarks/latest.html" />
            <title>Nightly ERC20 benchmark report</title>
          </head>
          <body>
            <p>Redirecting to <a href="./benchmarks/latest.html">latest benchmark report</a>…</p>
          </body>
          </html>
          HTML
          touch out/pages/.nojekyll
      - name: Publish benchmark pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: out/pages
          enable_jekyll: false
      - name: Attach benchmark artifacts to run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-erc20-benchmark
          path: |
            out/raw-result.json
            out/status.json
            out/pages/index.html
            out/pages/benchmarks/latest.html
            out/pages/benchmarks/history.json
      - name: Enforce regression gate (after publish)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('out/status.json').read_text(encoding='utf-8'))
          print(json.dumps(status, indent=2))

          if status.get('should_fail'):
              raise SystemExit('Regression gate failed: current TPS is below 50% of rolling 7-night median')
          print('Regression gate passed')
          PY
